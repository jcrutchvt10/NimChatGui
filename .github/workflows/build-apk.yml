name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Repair dotnet workloads
        run: dotnet workload repair --project NimChatGui.Android.csproj

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --project NimChatGui.Android.csproj

      - name: Restore dependencies
        run: dotnet restore NimChatGui.Android.csproj -warnasmessage:NETSDK1202

      - name: Build APK
        run: |
          dotnet publish NimChatGui.Android.csproj \
            -f net8.0-android -c Release \
            -p:AndroidSigningKeyStore= \
            -p:AndroidSigningKeyAlias= \
            -p:AndroidSigningKeyPass= \
            -p:AndroidSigningStorePass= \
            -warnasmessage:NETSDK1202
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NimChatGui-APK
          path: bin/Release/net8.0-android/publish/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NimChatGui-APK
          path: bin/Release/net8.0-android/publish/*.apk
          
